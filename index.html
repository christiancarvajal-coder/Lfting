<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f0;--surface:#fff;--ink:#1b1f1d;--muted:#5d665f;--line:#d9ded7;--accent:#1f4fd8;--accent-ink:#fff;--good:#1f7a4d;--warn:#b4541a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--surface:#1f2326;--ink:#eef1ee;--muted:#9aa49d;--line:#31373a;--accent:#6d93ff;--accent-ink:#0d1220;--good:#5fcf94;--warn:#f0985a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--surface:#1f2326;--ink:#eef1ee;--muted:#9aa49d;--line:#31373a;--accent:#6d93ff;--accent-ink:#0d1220;--good:#5fcf94;--warn:#f0985a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font:700 34px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 2px;letter-spacing:.01em}
h2{font:700 22px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.meter{margin-bottom:14px}.meter:last-child{margin-bottom:0}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font:700 38px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.big small{font:500 15px Barlow,sans-serif;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.over i{background:var(--warn)}
.note{font-size:14px;color:var(--muted);margin-top:4px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px;flex:1 1 90px;min-width:0}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:600 16px Barlow,sans-serif;min-height:44px;border-radius:10px;border:0;padding:0 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--muted);padding:0 10px;min-height:36px}
form button{flex:1 1 100%}
ul{list-style:none;margin:0;padding:0}
