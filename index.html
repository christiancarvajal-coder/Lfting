<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f2f4f0;
  --surface: #ffffff;
  --ink: #1b1f1d;
  --muted: #5d665f;
  --line: #d9ded7;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --warn: #b4541a;
  color-scheme: light;
  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181a;
    --surface: #1f2326;
    --ink: #eef1ee;
    --muted: #9aa49d;
    --line: #31373a;
    --accent: #6d93ff;
    --accent-ink: #0d1220;
    --warn: #f0985a;
    color-scheme: dark;
  }
}

*, *::before, *::after {
  box-sizing: inherit;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 16px/1.45 Barlow, system-ui, sans-serif;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px 100px;
}

h1 {
  font: 700 34px/1 "Barlow Condensed", sans-serif;
  margin: 8px 0 4px;
}

.sub {
  color: var(--muted);
  margin: 0 0 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}

.mrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.note {
  font-size: 14px;
  color: var(--muted);
  margin-top: 5px;
}

form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
}

label {
  display: flex;
  flex-direction: column;
  font-size: 13px;
  color: var(--muted);
  gap: 4px;
  flex: 1 1 90px;
  min-width: 0;
}

input {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  width: 100%;
  min-height: 44px;
}

/* iPhone Safari: stop the date field from overflowing its card */
input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  min-width: 0;
  max-width: 100%;
  text-align: left;
}

input[type="date"]::-webkit-date-and-time-value {
  text-align: left;
  margin: 0;
}

input:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

button {
  font: 600 16px Barlow, sans-serif;
  min-height: 44px;
  border-radius: 10px;
  border: 0;
  padding: 0 16px;
  cursor: pointer;
  background: var(--accent);
  color: var(--accent-ink);
}

button.ghost {
  background: transparent;
  color: var(--muted);
  padding: 0 10px;
}

form > button {
  flex: 1 1 100%;
}

ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--line);
}

li:first-child {
  border-top: 0;
}

.grp {
  font-weight: 600;
}

nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

nav button {
  flex: 1;
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  min-height: 56px;
}

nav button[aria-selected="true"] {
  color: var(--accent);
  box-shadow: inset 0 3px 0 var(--accent);
}

.empty {
  color: var(--muted);
  padding: 6px 0;
}

svg {
  display: block;
}

.chart {
  width: 100%;
  height: auto;
}

h2 {
  font: 700 22px/1.1 "Barlow Condensed", sans-serif;
  margin: 0 0 6px;
}

.hist-ex {
  font-weight: 600;
  margin-top: 10px;
}

.hist-ex:first-of-type {
  margin-top: 6px;
}

.hist-set {
  font-size: 15px;
  color: var(--muted);
}

button.link {
  background: transparent;
  color: var(--accent);
  padding: 0 4px;
  min-height: 36px;
  white-space: nowrap;
}

li button.pick {
  flex: 1;
  background: transparent;
  color: var(--ink);
  text-align: left;
  padding: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

li button.pick span:last-child {
  color: var(--muted);
  font-weight: 500;
  font-size: 14px;
}

/* Account bar + screen */
.acct {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 4px;
}

.acct span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.msg {
  font-size: 14px;
  margin-top: 10px;
}

.msg.err { color: var(--warn); }

.stack {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  flex-wrap: nowrap;
  gap: 10px;
}

.stack > button { flex: none; width: 100%; }

.stack label { flex: none; }

button.secondary {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--line);
}

button:disabled { opacity: .6; }

/* Rest timer bar (sits just above the tab bar) */
#timer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  padding: 8px 12px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  z-index: 5;
}

#timer[hidden] { display: none; }

body.has-timer main { padding-bottom: 170px; }

.trow {
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tlabel {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.1;
}

.ttime {
  font: 700 34px/1 "Barlow Condensed", sans-serif;
  font-variant-numeric: tabular-nums;
  min-width: 70px;
  text-align: center;
}

.trow .grow { flex: 1; }

.trow button {
  min-height: 44px;
  padding: 0 12px;
}

.trow button.round {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  min-width: 48px;
  padding: 0 8px;
}

.trow button.pill {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  font-size: 13px;
  min-height: 34px;
  padding: 0 10px;
}

.trow button.pill[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent);
}

#timer.done {
  background: var(--accent);
  color: var(--accent-ink);
}

#timer.done .tlabel { color: var(--accent-ink); }

#timer.done button {
  background: var(--accent-ink);
  color: var(--accent);
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main id="app"></main>

<div id="timer" hidden></div>

<nav role="tablist" aria-label="Sections">
  <button role="tab" data-t="lift" aria-selected="true">Lift</button>
  <button role="tab" data-t="history" aria-selected="false">History</button>
  <button role="tab" data-t="weight" aria-selected="false">Weight</button>
</nav>

<script>
"use strict";

const KEY = "lift:v1";

const DEFAULT_DATA = {
  exs: [],
  lifts: [],
  weights: []
};

function cloneDefaults() {
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function normalize(data) {
  data = data || {};

  return {
    exs: Array.isArray(data.exs) ? data.exs : [],
    lifts: Array.isArray(data.lifts) ? data.lifts : [],
    weights: Array.isArray(data.weights) ? data.weights : []
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(KEY);

    if (raw) {
      return normalize(JSON.parse(raw));
    }
  } catch (error) {
    console.warn("Unable to load saved data:", error);
  }

  return cloneDefaults();
}

let S = loadData();
let tab = ["#weight", "#history"].includes(location.hash)
  ? location.hash.slice(1)
  : "lift";
let sel = today();
let query = "";

function writeLocal() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (error) {
    console.error("Unable to save data:", error);
  }
}

function saveData() {
  writeLocal();
  pushCloud();
}

/* ---------- Account sync (Firebase) ---------- */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBW2H92vjB42KBCxMBTOtaAC84eRNcsAec",
  authDomain: "lifting-log-96893.firebaseapp.com",
  projectId: "lifting-log-96893",
  storageBucket: "lifting-log-96893.firebasestorage.app",
  messagingSenderId: "189248766005",
  appId: "1:189248766005:web:cbc922edf76132a0aaf17c"
};

const FB_URL = "https://www.gstatic.com/firebasejs/10.12.2/";
const LINK_KEY = "lift:linked-uid";

let fb = null;          // Firebase handles once loaded
let user = null;        // signed-in user, or null
let authReady = false;  // true once we know if someone is signed in
let cloudReady = false; // true once this device has loaded the account's data
let cloudFailed = false;
let authBusy = false;
let authMsg = "";
let authErr = false;
let authEmail = "";
let authPass = "";
let unsubscribe = null;

async function initFirebase() {
  try {
    const [appM, authM, fsM] = await Promise.all([
      import(FB_URL + "firebase-app.js"),
      import(FB_URL + "firebase-auth.js"),
      import(FB_URL + "firebase-firestore.js")
    ]);

    const app = appM.initializeApp(FIREBASE_CONFIG);

    const auth = authM.initializeAuth(app, {
      persistence: [authM.indexedDBLocalPersistence, authM.browserLocalPersistence]
    });

    let db;
    try {
      db = fsM.initializeFirestore(app, {
        localCache: fsM.persistentLocalCache(),
        ignoreUndefinedProperties: true
      });
    } catch (error) {
      db = fsM.getFirestore(app);
    }

    fb = { auth: auth, db: db, A: authM, F: fsM };
    authM.onAuthStateChanged(auth, onUserChanged);
  } catch (error) {
    // No internet on first load, etc. The app keeps working on this phone.
    console.warn("Account sync unavailable:", error);
    cloudFailed = true;
    authReady = true;
    render();
  }
}

// Combine two data sets without duplicates (used the first time you sign in on a device).
function mergeData(a, b) {
  const out = {};

  ["exs", "lifts", "weights"].forEach(function (k) {
    const seen = new Set();
    out[k] = [];

    a[k].concat(b[k]).forEach(function (item) {
      if (seen.has(item.id)) return;
      seen.add(item.id);
      out[k].push(item);
    });
  });

  // Weight: keep one weigh-in per date.
  const byDate = {};
  out.weights.forEach(function (w) { byDate[w.d] = w; });
  out.weights = Object.values(byDate);

  return out;
}

function onUserChanged(u) {
  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  user = u;
  authReady = true;
  cloudReady = false;

  if (u) {
    if (tab === "account") tab = "lift";

    const ref = fb.F.doc(fb.db, "users", u.uid);

    unsubscribe = fb.F.onSnapshot(ref, function (snap) {
      const firstOnDevice = localStorage.getItem(LINK_KEY) !== u.uid;

      if (!snap.exists()) {
        // Brand-new account: upload what's on this phone.
        localStorage.setItem(LINK_KEY, u.uid);
        cloudReady = true;
        pushCloud();
        render();
        return;
      }

      let next = normalize(snap.data().data);

      if (firstOnDevice) {
        next = mergeData(next, S);
        localStorage.setItem(LINK_KEY, u.uid);
        S = next;
        cloudReady = true;
        writeLocal();
        pushCloud();
        render();
        return;
      }

      cloudReady = true;

      if (JSON.stringify(next) !== JSON.stringify(S)) {
        S = next;
        writeLocal();
        rerenderKeepingSearch();
      }
    }, function (error) {
      console.warn("Sync error:", error);
      authMsg = "Couldn't reach your account data. Changes are still saved on this phone.";
      authErr = true;
      render();
    });
  }

  render();
}

function pushCloud() {
  if (!fb || !user || !cloudReady) return;

  const ref = fb.F.doc(fb.db, "users", user.uid);

  fb.F.setDoc(ref, {
    data: S,
    updatedAt: fb.F.serverTimestamp()
  }).catch(function (error) {
    console.warn("Upload failed:", error);
  });
}

// Data from another device arrived: redraw without kicking you out of the search box.
function rerenderKeepingSearch() {
  if (tab === "history" && document.activeElement && document.activeElement.id === "q") {
    document.getElementById("hist").innerHTML = historyResults();
  } else {
    render();
  }
}

function friendlyAuthError(error) {
  const code = (error && error.code) || "";

  if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) {
    return "Wrong email or password.";
  }
  if (code.includes("email-already-in-use")) return "That email already has an account. Tap Sign in instead.";
  if (code.includes("weak-password")) return "Password needs at least 6 characters.";
  if (code.includes("invalid-email")) return "That email doesn't look right.";
  if (code.includes("missing-password")) return "Enter a password.";
  if (code.includes("network")) return "No internet connection. Try again.";
  if (code.includes("too-many-requests")) return "Too many tries. Wait a minute and try again.";
  if (code.includes("unauthorized-domain")) return "This site isn't allowed yet. Add it under Authentication → Settings → Authorized domains in Firebase.";
  if (code.includes("configuration-not-found")) return "Sign-in isn't set up in Firebase yet. Turn on Email/Password under Authentication → Sign-in method.";
  if (code.includes("operation-not-allowed")) return "Email/Password sign-in isn't turned on in Firebase yet.";

  return "Something went wrong (" + (code || "unknown error") + ").";
}

async function doAuth(action) {
  if (!fb) return;

  const email = authEmail.trim();
  const password = authPass;

  if (!email) {
    authMsg = "Type your email first.";
    authErr = true;
    render();
    return;
  }

  if (action !== "reset" && password.length < 6) {
    authMsg = "Type a password (at least 6 characters).";
    authErr = true;
    render();
    return;
  }

  authBusy = true;
  authMsg = "";
  authErr = false;
  render();

  try {
    if (action === "signin") {
      await fb.A.signInWithEmailAndPassword(fb.auth, email.trim(), password);
    } else if (action === "signup") {
      await fb.A.createUserWithEmailAndPassword(fb.auth, email.trim(), password);
    } else if (action === "reset") {
      if (!email.trim()) throw { code: "invalid-email" };
      await fb.A.sendPasswordResetEmail(fb.auth, email.trim());
      authMsg = "Password reset email sent. Check your inbox (and spam).";
    }
  } catch (error) {
    authMsg = friendlyAuthError(error);
    authErr = true;
  }

  authBusy = false;
  if (user) authPass = "";
  render();
}

async function doSignOut() {
  if (!fb || !user) return;

  if (!confirm("Sign out? Your data stays in your account and comes back when you sign in.")) return;

  await fb.A.signOut(fb.auth);

  // Clear this phone's copy so the next person doesn't see it.
  S = cloneDefaults();
  writeLocal();
  localStorage.removeItem(LINK_KEY);
  authMsg = "";
  tab = "lift";
  render();
}

function accountBar() {
  let text;
  let btn;

  if (!authReady) {
    text = "Checking account…";
    btn = "";
  } else if (user) {
    text = "☁︎ Saved to " + escapeHTML(user.email || "your account");
    btn = `<button type="button" class="link" data-t="account">Account</button>`;
  } else if (cloudFailed) {
    text = "Saved on this phone only (offline)";
    btn = "";
  } else {
    text = "Saved on this phone only";
    btn = `<button type="button" class="link" data-t="account">Sign in</button>`;
  }

  return `<div class="acct"><span>${text}</span>${btn}</div>`;
}

function renderAccount() {
  const msg = authMsg
    ? `<div class="msg${authErr ? " err" : ""}" role="status">${escapeHTML(authMsg)}</div>`
    : "";

  if (user) {
    return `
      <h1>Account</h1>
      <p class="sub">Your lifts and weigh-ins save to your account and show up on any device you sign in on.</p>

      <div class="card stack">
        <div>Signed in as <strong>${escapeHTML(user.email || "")}</strong></div>
        <button type="button" class="secondary" data-auth="signout">Sign out</button>
        ${msg}
      </div>
    `;
  }

  return `
    <h1>Account</h1>
    <p class="sub">Sign in to save your data to an account. Anything already on this phone gets added to it.</p>

    <div class="card">
      <form data-f="auth" class="stack">
        <label>
          Email
          <input id="email" type="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" value="${escapeHTML(authEmail)}">
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" value="${escapeHTML(authPass)}">
        </label>

        <button type="submit" ${authBusy ? "disabled" : ""}>${authBusy ? "Please wait…" : "Sign in"}</button>
        <button type="button" class="secondary" data-auth="signup" ${authBusy ? "disabled" : ""}>Create account</button>
        <button type="button" class="link" data-auth="reset" ${authBusy ? "disabled" : ""}>Forgot password?</button>
      </form>
      ${msg}
    </div>

    <button type="button" class="link" data-t="lift">← Back</button>
  `;
}

function today() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function (char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function number(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function nice(date) {
  const parts = date.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  ).toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  });
}

function newId() {
  return Date.now() + Math.floor(Math.random() * 100000);
}

function dateBar() {
  return `
    <div class="card">
      <label>
        Date
        <input
          type="date"
          id="sel"
          value="${escapeHTML(sel)}"
          max="${today()}"
          required
        >
      </label>
    </div>
  `;
}

function allNames() {
  const seen = new Set();
  const names = [];

  [...S.exs, ...S.lifts].forEach(function (item) {
    if (!item.ex) return;

    const key = item.ex.toLowerCase();

    if (!seen.has(key)) {
      seen.add(key);
      names.push(item.ex);
    }
  });

  return names;
}

function dayExercises(date) {
  const seen = new Set();
  const names = [];

  [...S.exs, ...S.lifts].forEach(function (item) {
    if (item.d !== date || !item.ex) return;

    const key = item.ex.toLowerCase();

    if (!seen.has(key)) {
      seen.add(key);
      names.push(item.ex);
    }
  });

  return names;
}

function canonicalName(name) {
  const existing = allNames().find(function (item) {
    return item.toLowerCase() === name.toLowerCase();
  });

  return existing || name;
}

function renderLift() {
  let html = `
    <h1>Lift</h1>
    <p class="sub">Add an exercise, then log your sets.</p>
    ${dateBar()}

    <div class="card">
      <form data-f="exercise">
        <label style="flex-basis:100%">
          Exercise
          <input
            name="ex"
            list="exs"
            placeholder="Leg press"
            maxlength="80"
            required
          >
        </label>

        <datalist id="exs">
          ${allNames().map(function (name) {
            return `<option value="${escapeHTML(name)}"></option>`;
          }).join("")}
        </datalist>

        <button type="submit">Add exercise</button>
      </form>
    </div>
  `;

  const exercises = dayExercises(sel);

  if (!exercises.length) {
    html += `
      <div class="card">
        <div class="empty">
          No exercises for this day. Add one above.
        </div>
      </div>
    `;
  }

  exercises.forEach(function (exercise) {
    const key = exercise.toLowerCase();

    const sets = S.lifts.filter(function (item) {
      return item.d === sel && item.ex.toLowerCase() === key;
    });

    const previous = S.lifts.filter(function (item) {
      return item.ex.toLowerCase() === key && item.d < sel;
    });

    let lastWorkout = "";

    if (previous.length) {
      const previousDate = previous.reduce(function (latest, item) {
        return item.d > latest ? item.d : latest;
      }, "");

      const best = previous
        .filter(function (item) {
          return item.d === previousDate;
        })
        .sort(function (a, b) {
          return b.w - a.w || b.r - a.r;
        })[0];

      if (best) {
        lastWorkout = `
          <div class="note">
            Last time (${nice(previousDate)}):
            best set ${best.r} reps × ${best.w} lb
          </div>
        `;
      }
    }

    html += `
      <div class="card">
        <div class="mrow">
          <div class="grp">${escapeHTML(exercise)}</div>

          <button
            type="button"
            class="ghost"
            data-delex="${escapeHTML(exercise)}"
          >Remove</button>
        </div>

        ${lastWorkout}

        ${sets.length ? `
          <ul>
            ${sets.map(function (item, index) {
              return `
                <li>
                  <span>
                    Set ${index + 1}: ${item.r} reps × ${item.w} lb
                  </span>

                  <button
                    type="button"
                    class="ghost"
                    data-del="lifts"
                    data-id="${item.id}"
                    aria-label="Delete set ${index + 1}"
                  >Delete</button>
                </li>
              `;
            }).join("")}
          </ul>
        ` : `
          <div class="empty">No sets logged yet.</div>
        `}

        <form data-f="set" style="margin-top:12px">
          <input
            type="hidden"
            name="ex"
            value="${escapeHTML(exercise)}"
          >

          <label>
            Reps
            <input
              name="r"
              type="number"
              min="1"
              max="1000"
              step="1"
              inputmode="numeric"
              required
            >
          </label>

          <label>
            Weight (lb)
            <input
              name="w"
              type="number"
              min="0"
              max="100000"
              step="0.5"
              inputmode="decimal"
              required
            >
          </label>

          <label>
            Sets
            <input
              name="n"
              type="number"
              min="1"
              max="10"
              step="1"
              inputmode="numeric"
            >
          </label>

          <button type="submit">Add set</button>
        </form>
      </div>
    `;
  });

  return html;
}

function renderWeight() {
  const weights = S.weights.slice().sort(function (a, b) {
    return a.d.localeCompare(b.d) || a.id - b.id;
  });

  const recent = weights.slice(-30);
  const latest = weights.length ? weights[weights.length - 1] : null;

  let html = `
    <h1>Weight</h1>

    <p class="sub">
      ${latest
        ? `Latest: ${latest.w} lb on ${nice(latest.d)}`
        : "Weigh in consistently to track your progress."}
    </p>

    ${dateBar()}

    <div class="card">
      <form data-f="weight">
        <label>
          Weight (lb)
          <input
            name="w"
            type="number"
            min="1"
            max="2000"
            step="0.1"
            inputmode="decimal"
            required
          >
        </label>

        <button type="submit">Save weigh-in</button>
      </form>
    </div>
  `;

  if (recent.length > 1) {
    const values = recent.map(function (item) {
      return item.w;
    });

    let min = Math.min(...values);
    let max = Math.max(...values);

    if (min === max) {
      min -= 1;
      max += 1;
    } else {
      min -= 1;
      max += 1;
    }

    const width = 320;
    const height = 160;

    const points = recent.map(function (item, index) {
      const x = 12 + index * (width - 24) / (recent.length - 1);
      const y = height - 20 -
        ((item.w - min) / (max - min)) * (height - 40);

      return { x, y, weight: item.w, date: item.d };
    });

    html += `
      <div class="card">
        <h2>Weight trend</h2>

        <p class="note">Your last ${recent.length} weigh-ins</p>

        <svg
          class="chart"
          viewBox="0 0 ${width} ${height}"
          role="img"
          aria-label="Weight trend chart"
        >
          <text x="8" y="12" font-size="11" fill="var(--muted)">
            ${max.toFixed(1)} lb
          </text>

          <text x="8" y="${height - 3}" font-size="11" fill="var(--muted)">
            ${min.toFixed(1)} lb
          </text>

          <polyline
            fill="none"
            stroke="var(--accent)"
            stroke-width="2.5"
            stroke-linejoin="round"
            stroke-linecap="round"
            points="${points.map(function (p) {
              return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
            }).join(" ")}"
          ></polyline>

          ${points.map(function (p) {
            return `
              <circle
                cx="${p.x.toFixed(1)}"
                cy="${p.y.toFixed(1)}"
                r="3"
                fill="var(--accent)"
              >
                <title>${escapeHTML(p.date)}: ${p.weight} lb</title>
              </circle>
            `;
          }).join("")}
        </svg>
      </div>
    `;
  }

  html += `
    <div class="card">
      <h2>Weight history</h2>

      ${weights.length ? `
        <ul>
          ${weights.slice().reverse().slice(0, 30).map(function (item) {
            return `
              <li>
                <span>${nice(item.d)}: ${item.w} lb</span>

                <button
                  type="button"
                  class="ghost"
                  data-del="weights"
                  data-id="${item.id}"
                >Delete</button>
              </li>
            `;
          }).join("")}
        </ul>
      ` : `
        <div class="empty">No weigh-ins yet. Add your first one above.</div>
      `}
    </div>
  `;

  return html;
}

function renderHistory() {
  return `
    <h1>History</h1>
    <p class="sub">Search an exercise to see every day you did it.</p>

    <div class="card">
      <label>
        Exercise
        <input
          id="q"
          type="search"
          list="exs-h"
          placeholder="Search, e.g. Bench press"
          value="${escapeHTML(query)}"
          autocomplete="off"
        >
      </label>

      <datalist id="exs-h">
        ${allNames().map(function (name) {
          return `<option value="${escapeHTML(name)}"></option>`;
        }).join("")}
      </datalist>
    </div>

    <div id="hist">${historyResults()}</div>
  `;
}

function historyResults() {
  const q = query.trim().toLowerCase();

  // Every logged exercise, with the days it was done.
  const byName = {};

  [...S.exs, ...S.lifts].forEach(function (item) {
    if (!item.ex || !item.d) return;

    const key = item.ex.toLowerCase();

    if (!byName[key]) byName[key] = { name: canonicalName(item.ex), days: new Set() };
    byName[key].days.add(item.d);
  });

  const all = Object.values(byName);

  if (!all.length) {
    return `<div class="card"><div class="empty">Nothing logged yet. Add exercises on the Lift tab.</div></div>`;
  }

  // No search yet: list every exercise and when it was last done.
  if (!q) {
    all.sort(function (a, b) {
      return a.name.localeCompare(b.name);
    });

    return `
      <div class="card">
        <h2>All exercises</h2>
        <ul>
          ${all.map(function (e) {
            const days = [...e.days].sort();
            const last = days[days.length - 1];

            return `
              <li>
                <button type="button" class="pick" data-q="${escapeHTML(e.name)}">
                  <span>${escapeHTML(e.name)}</span>
                  <span>${days.length} day${days.length === 1 ? "" : "s"} · last ${nice(last)}</span>
                </button>
              </li>
            `;
          }).join("")}
        </ul>
      </div>
    `;
  }

  const matches = all.filter(function (e) {
    return e.name.toLowerCase().includes(q);
  });

  if (!matches.length) {
    return `<div class="card"><div class="empty">No exercises match "${escapeHTML(query.trim())}".</div></div>`;
  }

  const matchKeys = new Set(matches.map(function (e) {
    return e.name.toLowerCase();
  }));

  // Group matching days, newest first.
  const dates = new Set();
  matches.forEach(function (e) {
    e.days.forEach(function (d) { dates.add(d); });
  });

  const sortedDates = [...dates].sort().reverse();

  return `
    <p class="note" style="margin:0 0 10px">
      Done on ${sortedDates.length} day${sortedDates.length === 1 ? "" : "s"}
    </p>

    ${sortedDates.map(function (date) {
      const names = dayExercises(date).filter(function (n) {
        return matchKeys.has(n.toLowerCase());
      });

      return `
        <div class="card">
          <div class="mrow">
            <h2 style="margin:0">${nice(date)}</h2>
            <button type="button" class="link" data-go="${date}">Open day</button>
          </div>

          ${names.map(function (name) {
            const key = name.toLowerCase();
            const sets = S.lifts.filter(function (item) {
              return item.d === date && item.ex.toLowerCase() === key;
            });

            return `
              <div class="hist-ex">${escapeHTML(canonicalName(name))}</div>
              ${sets.length
                ? sets.map(function (item, i) {
                    return `<div class="hist-set">Set ${i + 1}: ${item.r} reps × ${item.w} lb</div>`;
                  }).join("")
                : `<div class="hist-set">No sets logged</div>`}
            `;
          }).join("")}
        </div>
      `;
    }).join("")}
  `;
}

/* ---------- Rest timer ---------- */

const TKEY = "lift:timer";

function loadTimer() {
  const base = { dur: 90, auto: true, end: null, left: null };

  try {
    return Object.assign(base, JSON.parse(localStorage.getItem(TKEY) || "{}"));
  } catch (error) {
    return base;
  }
}

let T = loadTimer();   // dur = seconds, end = when it finishes, left = ms left while paused
let timerDone = false;
let ticker = null;

function saveTimer() {
  try {
    localStorage.setItem(TKEY, JSON.stringify(T));
  } catch (error) {}
}

function timeLeft() {
  if (T.end) return Math.max(0, T.end - Date.now());
  if (T.left != null) return T.left;
  return T.dur * 1000;
}

function fmt(ms) {
  const total = Math.ceil(ms / 1000);
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}

function buzz() {
  try {
    if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
  } catch (error) {}
}

function startTimer() {
  T.end = Date.now() + T.dur * 1000;
  T.left = null;
  timerDone = false;
  saveTimer();
  renderTimer();
}

function tick() {
  if (T.end && Date.now() >= T.end) {
    T.end = null;
    T.left = null;
    timerDone = true;
    saveTimer();
    buzz();
    renderTimer();
    return;
  }

  const el = document.getElementById("tleft");
  if (el) el.textContent = fmt(timeLeft());
}

function timerAction(action) {
  if (action === "start" || action === "again") {
    startTimer();
    return;
  }

  if (action === "pause") {
    T.left = timeLeft();
    T.end = null;
  }

  if (action === "resume") {
      T.end = Date.now() + T.left;
    T.left = null;
  }

  if (action === "stop") {
    T.end = null;
    T.left = null;
    timerDone = false;
  }

  if (action === "auto") T.auto = !T.auto;

  if (action === "minus" || action === "plus") {
    const step = action === "plus" ? 15 : -15;

    if (T.end) {
      T.end = Math.max(Date.now() + 1000, T.end + step * 1000);
    } else if (T.left != null) {
      T.left = Math.max(1000, T.left + step * 1000);
    } else {
      T.dur = Math.min(600, Math.max(15, T.dur + step));
    }
  }

  saveTimer();
  renderTimer();
}

function renderTimer() {
  const box = document.getElementById("timer");
  const running = !!T.end;
  const paused = !running && T.left != null;
  const active = running || paused || timerDone;

  // Always on the Lift tab; on other tabs only while it's going.
  const show = tab === "lift" || (active && tab !== "account");

  box.hidden = !show;
  document.body.classList.toggle("has-timer", show);
  box.classList.toggle("done", timerDone);

  if (running && !ticker) ticker = setInterval(tick, 250);
  if (!running && ticker) {
    clearInterval(ticker);
    ticker = null;
  }

  if (!show) return;

  if (timerDone) {
    box.innerHTML = `
      <div class="trow" role="status">
        <div class="grow"><div class="ttime" style="text-align:left">Rest's up!</div></div>
        <button type="button" data-timer="again">Again</button>
        <button type="button" data-timer="stop">Done</button>
      </div>`;
    return;
  }

  if (running || paused) {
    box.innerHTML = `
      <div class="trow">
        <button type="button" class="round" data-timer="minus" aria-label="15 seconds less">−15</button>
        <div class="grow" style="text-align:center">
          <div class="tlabel">${paused ? "Paused" : "Rest"}</div>
          <div class="ttime" id="tleft">${fmt(timeLeft())}</div>
        </div>
        <button type="button" class="round" data-timer="plus" aria-label="15 seconds more">+15</button>
        <button type="button" data-timer="${paused ? "resume" : "pause"}">${paused ? "Resume" : "Pause"}</button>
        <button type="button" class="round" data-timer="stop" aria-label="Stop timer">✕</button>
      </div>`;
    return;
  }

  box.innerHTML = `
    <div class="trow">
      <button type="button" class="pill" data-timer="auto" aria-pressed="${T.auto}">Auto ${T.auto ? "on" : "off"}</button>
      <div class="grow"></div>
      <button type="button" class="round" data-timer="minus" aria-label="15 seconds less">−</button>
      <div style="text-align:center">
        <div class="tlabel">Rest</div>
        <div class="ttime">${fmt(T.dur * 1000)}</div>
      </div>
      <button type="button" class="round" data-timer="plus" aria-label="15 seconds more">+</button>
      <button type="button" data-timer="start">Start</button>
    </div>`;
}

// Coming back to the app after the timer ran out in the background.
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) tick();
});

function render() {
  const app = document.getElementById("app");

  app.innerHTML = accountBar() + (
    tab === "lift" ? renderLift() :
    tab === "history" ? renderHistory() :
    tab === "account" ? renderAccount() :
    renderWeight());

  document.querySelectorAll("nav button").forEach(function (button) {
    button.setAttribute(
      "aria-selected",
      String(button.dataset.t === tab)
    );
  });

  renderTimer();
}

document.addEventListener("submit", function (event) {
  const form = event.target;
  const type = form.dataset.f;

  if (!type) return;

  event.preventDefault();

  if (type === "auth") {
    doAuth("signin");
    return;
  }

  const getValue = function (name) {
    return form.elements[name].value;
  };

  if (type === "exercise") {
    const rawName = getValue("ex").trim();

    if (!rawName) return;

    const name = canonicalName(rawName);

    const exists = dayExercises(sel).some(function (item) {
      return item.toLowerCase() === name.toLowerCase();
    });

    if (exists) {
      alert("This exercise already exists for the selected date.");
      return;
    }

    S.exs.push({
      id: newId(),
      d: sel,
      ex: name
    });
  }

  if (type === "set") {
    const exercise = getValue("ex");
    const reps = Number(getValue("r"));
    const weight = Number(getValue("w"));
    const count = getValue("n").trim() === "" ? 1 : Number(getValue("n")); // blank = 1 set

    if (
      !Number.isInteger(reps) || reps < 1 ||
      !Number.isFinite(weight) || weight < 0 ||
      !Number.isInteger(count) || count < 1 || count > 10
    ) {
      alert("Please enter valid reps, weight, and set count.");
      return;
    }

    for (let i = 0; i < count; i++) {
      S.lifts.push({
        id: newId(),
        d: sel,
        ex: exercise,
        w: weight,
        r: reps
      });
    }
  }

  if (type === "weight") {
    const weight = Number(getValue("w"));

    if (!Number.isFinite(weight) || weight <= 0 || weight > 2000) {
      alert("Please enter a valid body weight.");
      return;
    }

    // Keep one weigh-in per date.
    S.weights = S.weights.filter(function (item) {
      return item.d !== sel;
    });

    S.weights.push({
      id: newId(),
      d: sel,
      w: weight
    });
  }

  saveData();
  render();

  if (type === "set" && T.auto) startTimer();
});

document.addEventListener("input", function (event) {
  if (event.target.id === "email") authEmail = event.target.value;
  if (event.target.id === "password") authPass = event.target.value;
  if (event.target.id !== "q") return;

  query = event.target.value;
  document.getElementById("hist").innerHTML = historyResults();
});

document.addEventListener("change", function (event) {
  if (event.target.id !== "sel") return;

  const date = event.target.value;

  if (!date || date > today()) {
    alert("Please select a valid date.");
    event.target.value = sel;
    return;
  }

  sel = date;
  render();
});

document.addEventListener("click", function (event) {
  const button = event.target.closest("button");

  if (!button) return;

  if (button.dataset.timer) {
    timerAction(button.dataset.timer);
    return;
  }

  if (button.dataset.auth) {
    if (button.dataset.auth === "signout") doSignOut();
    else doAuth(button.dataset.auth);
    return;
  }

  if (button.dataset.t) {
    tab = button.dataset.t;
    authMsg = "";

    history.replaceState(null, "", "#" + (tab === "account" ? "lift" : tab));

    render();
    window.scrollTo(0, 0);
    return;
  }

  if (button.dataset.q) {
    query = button.dataset.q;
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (button.dataset.go) {
    sel = button.dataset.go;
    tab = "lift";
    history.replaceState(null, "", "#lift");
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (button.dataset.delex) {
    const name = button.dataset.delex.toLowerCase();

    const confirmed = confirm(
      "Remove this exercise and all its sets for this day?"
    );

    if (!confirmed) return;

    S.exs = S.exs.filter(function (item) {
      return !(item.d === sel && item.ex.toLowerCase() === name);
    });

    S.lifts = S.lifts.filter(function (item) {
      return !(item.d === sel && item.ex.toLowerCase() === name);
    });

    saveData();
    render();
    return;
  }

  if (button.dataset.del) {
    const confirmed = confirm("Delete this entry?");

    if (!confirmed) return;

    const key = button.dataset.del;
    const id = Number(button.dataset.id);

    if (!Array.isArray(S[key])) return;

    S[key] = S[key].filter(function (item) {
      return item.id !== id;
    });

    saveData();
    render();
  }
});

render();
initFirebase();
</script>
