<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f2f4f0;
  --surface: #ffffff;
  --ink: #1b1f1d;
  --muted: #5d665f;
  --line: #d9ded7;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --warn: #b4541a;
  color-scheme: light;
  box-sizing: border-box;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181a;
    --surface: #1f2326;
    --ink: #eef1ee;
    --muted: #9aa49d;
    --line: #31373a;
    --accent: #6d93ff;
    --accent-ink: #0d1220;
    --warn: #f0985a;
    color-scheme: dark;
  }
}

*, *::before, *::after {
  box-sizing: inherit;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 16px/1.45 Barlow, system-ui, sans-serif;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px 100px;
}

h1 {
  font: 700 34px/1 "Barlow Condensed", sans-serif;
  margin: 8px 0 4px;
}

.sub {
  color: var(--muted);
  margin: 0 0 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}

.mrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.note {
  font-size: 14px;
  color: var(--muted);
  margin-top: 5px;
}

form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
}

label {
  display: flex;
  flex-direction: column;
  font-size: 13px;
  color: var(--muted);
  gap: 4px;
  flex: 1 1 90px;
  min-width: 0;
}

input {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  width: 100%;
  min-height: 44px;
}

input:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

button {
  font: 600 16px Barlow, sans-serif;
  min-height: 44px;
  border-radius: 10px;
  border: 0;
  padding: 0 16px;
  cursor: pointer;
  background: var(--accent);
  color: var(--accent-ink);
}

button.ghost {
  background: transparent;
  color: var(--muted);
  padding: 0 10px;
}

form > button {
  flex: 1 1 100%;
}

ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--line);
}

li:first-child {
  border-top: 0;
}

.grp {
  font-weight: 600;
}

nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

nav button {
  flex: 1;
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  min-height: 56px;
}

nav button[aria-selected="true"] {
  color: var(--accent);
  box-shadow: inset 0 3px 0 var(--accent);
}

.empty {
  color: var(--muted);
  padding: 6px 0;
}

svg {
  display: block;
}

.chart {
  width: 100%;
  height: auto;
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main id="app"></main>

<nav role="tablist" aria-label="Sections">
  <button role="tab" data-t="lift" aria-selected="true">Lift</button>
  <button role="tab" data-t="weight" aria-selected="false">Weight</button>
</nav>

<script>
"use strict";

const KEY = "lift:v2";

const DEFAULT_DATA = {
  exs: [],
  lifts: [],
  weights: []
};

function cloneDefaults() {
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function loadData() {
  try {
    const raw = localStorage.getItem(KEY);

    if (raw) {
      const data = JSON.parse(raw);

      return {
        exs: Array.isArray(data.exs) ? data.exs : [],
        lifts: Array.isArray(data.lifts) ? data.lifts : [],
        weights: Array.isArray(data.weights) ? data.weights : []
      };
    }
  } catch (error) {
    console.warn("Unable to load saved data:", error);
  }

  return cloneDefaults();
}

let S = loadData();
let tab = location.hash === "#weight" ? "weight" : "lift";
let sel = today();

function saveData() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (error) {
    console.error("Unable to save data:", error);
    alert("Your browser could not save the data. Check your browser storage settings.");
  }
}

function today() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function (char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function number(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function nice(date) {
  const parts = date.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  ).toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  });
}

function newId() {
  return Date.now() + Math.floor(Math.random() * 100000);
}

function dateBar() {
  return `
    <div class="card">
      <label>
        Date
        <input
          type="date"
          id="sel"
          value="${escapeHTML(sel)}"
          max="${today()}"
          required
        >
      </label>
    </div>
  `;
}

function allNames() {
  const seen = new Set();
  const names = [];

  [...S.exs, ...S.lifts].forEach(function (item) {
    if (!item.ex) return;

    const key = item.ex.toLowerCase();

    if (!seen.has(key)) {
      seen.add(key);
      names.push(item.ex);
    }
  });

  return names;
}

function dayExercises(date) {
  const seen = new Set();
  const names = [];

  [...S.exs, ...S.lifts].forEach(function (item) {
    if (item.d !== date || !item.ex) return;

    const key = item.ex.toLowerCase();

    if (!seen.has(key)) {
      seen.add(key);
      names.push(item.ex);
    }
  });

  return names;
}

function canonicalName(name) {
  const existing = allNames().find(function (item) {
    return item.toLowerCase() === name.toLowerCase();
  });

  return existing || name;
}

function renderLift() {
  let html = `
    <h1>Lift</h1>
    <p class="sub">Add an exercise, then log your sets.</p>
    ${dateBar()}

    <div class="card">
      <form data-f="exercise">
        <label style="flex-basis:100%">
          Exercise
          <input
            name="ex"
            list="exs"
            placeholder="Leg press"
            maxlength="80"
            required
          >
        </label>

        <datalist id="exs">
          ${allNames().map(function (name) {
            return `<option value="${escapeHTML(name)}"></option>`;
          }).join("")}
        </datalist>

        <button type="submit">Add exercise</button>
      </form>
    </div>
  `;

  const exercises = dayExercises(sel);

  if (!exercises.length) {
    html += `
      <div class="card">
        <div class="empty">
          No exercises for this day. Add one above.
        </div>
      </div>
    `;
  }

  exercises.forEach(function (exercise) {
    const key = exercise.toLowerCase();

    const sets = S.lifts.filter(function (item) {
      return item.d === sel && item.ex.toLowerCase() === key;
    });

    const previous = S.lifts.filter(function (item) {
      return item.ex.toLowerCase() === key && item.d < sel;
    });

    let lastWorkout = "";

    if (previous.length) {
      const previousDate = previous.reduce(function (latest, item) {
        return item.d > latest ? item.d : latest;
      }, "");

      const best = previous
        .filter(function (item) {
          return item.d === previousDate;
        })
        .sort(function (a, b) {
          return b.w - a.w || b.r - a.r;
        })[0];

      if (best) {
        lastWorkout = `
          <div class="note">
            Last time (${nice(previousDate)}):
            best set ${best.r} reps × ${best.w} lb
          </div>
        `;
      }
    }

    html += `
      <div class="card">
        <div class="mrow">
          <div class="grp">${escapeHTML(exercise)}</div>

          <button
            type="button"
            class="ghost"
            data-delex="${escapeHTML(exercise)}"
          >Remove</button>
        </div>

        ${lastWorkout}

        ${sets.length ? `
          <ul>
            ${sets.map(function (item, index) {
              return `
                <li>
                  <span>
                    Set ${index + 1}: ${item.r} reps × ${item.w} lb
                  </span>

                  <button
                    type="button"
                    class="ghost"
                    data-del="lifts"
                    data-id="${item.id}"
                    aria-label="Delete set ${index + 1}"
                  >Delete</button>
                </li>
              `;
            }).join("")}
          </ul>
        ` : `
          <div class="empty">No sets logged yet.</div>
        `}

        <form data-f="set" style="margin-top:12px">
          <input
            type="hidden"
            name="ex"
            value="${escapeHTML(exercise)}"
          >

          <label>
            Reps
            <input
              name="r"
              type="number"
              min="1"
              max="1000"
              step="1"
              inputmode="numeric"
              required
            >
          </label>

          <label>
            Weight (lb)
            <input
              name="w"
              type="number"
              min="0"
              max="100000"
              step="0.5"
              inputmode="decimal"
              required
            >
          </label>

          <label>
            Sets
            <input
              name="n"
              type="number"
              min="1"
              max="10"
              step="1"
              value="1"
              required
            >
          </label>

          <button type="submit">Add set</button>
        </form>
      </div>
    `;
  });

  return html;
}

function renderWeight() {
  const weights = S.weights.slice().sort(function (a, b) {
    return a.d.localeCompare(b.d) || a.id - b.id;
  });

  const recent = weights.slice(-30);
  const latest = weights.length ? weights[weights.length - 1] : null;

  let html = `
    <h1>Weight</h1>

    <p class="sub">
      ${latest
        ? `Latest: ${latest.w} lb on ${nice(latest.d)}`
        : "Weigh in consistently to track your progress."}
    </p>

    ${dateBar()}

    <div class="card">
      <form data-f="weight">
        <label>
          Weight (lb)
          <input
            name="w"
            type="number"
            min="1"
            max="2000"
            step="0.1"
            inputmode="decimal"
            required
          >
        </label>

        <button type="submit">Save weigh-in</button>
      </form>
    </div>
  `;

  if (recent.length > 1) {
    const values = recent.map(function (item) {
      return item.w;
    });

    let min = Math.min(...values);
    let max = Math.max(...values);

    if (min === max) {
      min -= 1;
      max += 1;
    } else {
      min -= 1;
      max += 1;
    }

    const width = 320;
    const height = 160;

    const points = recent.map(function (item, index) {
      const x = 12 + index * (width - 24) / (recent.length - 1);
      const y = height - 20 -
        ((item.w - min) / (max - min)) * (height - 40);

      return { x, y, weight: item.w, date: item.d };
    });

    html += `
      <div class="card">
        <h2>Weight trend</h2>

        <p class="note">Your last ${recent.length} weigh-ins</p>

        <svg
          class="chart"
          viewBox="0 0 ${width} ${height}"
          role="img"
          aria-label="Weight trend chart"
        >
          <text x="8" y="12" font-size="11" fill="var(--muted)">
            ${max.toFixed(1)} lb
          </text>

          <text x="8" y="${height - 3}" font-size="11" fill="var(--muted)">
            ${min.toFixed(1)} lb
          </text>

          <polyline
            fill="none"
            stroke="var(--accent)"
            stroke-width="2.5"
            stroke-linejoin="round"
            stroke-linecap="round"
            points="${points.map(function (p) {
              return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
            }).join(" ")}"
          ></polyline>

          ${points.map(function (p) {
            return `
              <circle
                cx="${p.x.toFixed(1)}"
                cy="${p.y.toFixed(1)}"
                r="3"
                fill="var(--accent)"
              >
                <title>${escapeHTML(p.date)}: ${p.weight} lb</title>
              </circle>
            `;
          }).join("")}
        </svg>
      </div>
    `;
  }

  html += `
    <div class="card">
      <h2>Weight history</h2>

      ${weights.length ? `
        <ul>
          ${weights.slice().reverse().slice(0, 30).map(function (item) {
            return `
              <li>
                <span>${nice(item.d)}: ${item.w} lb</span>

                <button
                  type="button"
                  class="ghost"
                  data-del="weights"
                  data-id="${item.id}"
                >Delete</button>
              </li>
            `;
          }).join("")}
        </ul>
      ` : `
        <div class="empty">No weigh-ins yet. Add your first one above.</div>
      `}
    </div>
  `;

  return html;
}

function render() {
  const app = document.getElementById("app");

  app.innerHTML = tab === "lift" ? renderLift() : renderWeight();

  document.querySelectorAll("nav button").forEach(function (button) {
    button.setAttribute(
      "aria-selected",
      String(button.dataset.t === tab)
    );
  });
}

document.addEventListener("submit", function (event) {
  const form = event.target;
  const type = form.dataset.f;

  if (!type) return;

  event.preventDefault();

  const getValue = function (name) {
    return form.elements[name].value;
  };

  if (type === "exercise") {
    const rawName = getValue("ex").trim();

    if (!rawName) return;

    const name = canonicalName(rawName);

    const exists = dayExercises(sel).some(function (item) {
      return item.toLowerCase() === name.toLowerCase();
    });

    if (exists) {
      alert("This exercise already exists for the selected date.");
      return;
    }

    S.exs.push({
      id: newId(),
      d: sel,
      ex: name
    });
  }

  if (type === "set") {
    const exercise = getValue("ex");
    const reps = Number(getValue("r"));
    const weight = Number(getValue("w"));
    const count = Number(getValue("n"));

    if (
      !Number.isInteger(reps) || reps < 1 ||
      !Number.isFinite(weight) || weight < 0 ||
      !Number.isInteger(count) || count < 1 || count > 10
    ) {
      alert("Please enter valid reps, weight, and set count.");
      return;
    }

    for (let i = 0; i < count; i++) {
      S.lifts.push({
        id: newId(),
        d: sel,
        ex: exercise,
        w: weight,
        r: reps
      });
    }
  }

  if (type === "weight") {
    const weight = Number(getValue("w"));

    if (!Number.isFinite(weight) || weight <= 0 || weight > 2000) {
      alert("Please enter a valid body weight.");
      return;
    }

    // Keep one weigh-in per date.
    S.weights = S.weights.filter(function (item) {
      return item.d !== sel;
    });

    S.weights.push({
      id: newId(),
      d: sel,
      w: weight
    });
  }

  saveData();
  render();
});

document.addEventListener("change", function (event) {
  if (event.target.id !== "sel") return;

  const date = event.target.value;

  if (!date || date > today()) {
    alert("Please select a valid date.");
    event.target.value = sel;
    return;
  }

  sel = date;
  render();
});

document.addEventListener("click", function (event) {
  const button = event.target.closest("button");

  if (!button) return;

  if (button.dataset.t) {
    tab = button.dataset.t;

    history.replaceState(null, "", "#" + tab);

    render();
    window.scrollTo(0, 0);
    return;
  }

  if (button.dataset.delex) {
    const name = button.dataset.delex.toLowerCase();

    const confirmed = confirm(
      "Remove this exercise and all its sets for this day?"
    );

    if (!confirmed) return;

    S.exs = S.exs.filter(function (item) {
      return !(item.d === sel && item.ex.toLowerCase() === name);
    });

    S.lifts = S.lifts.filter(function (item) {
      return !(item.d === sel && item.ex.toLowerCase() === name);
    });

    saveData();
    render();
    return;
  }

  if (button.dataset.del) {
    const confirmed = confirm("Delete this entry?");

    if (!confirmed) return;

    const key = button.dataset.del;
    const id = Number(button.dataset.id);

    if (!Array.isArray(S[key])) return;

    S[key] = S[key].filter(function (item) {
      return item.id !== id;
    });

    saveData();
    render();
  }
});

render();
</script>
</body>
</html>
